# Shared infrastructure for the multi-tenant platform: one Caddy, Postgres,
# and Mailpit serving every tenant. Creates the external `platform` network
# that per-tenant app stacks (docker-compose.tenant.yml) attach to.
#
# Usage:
#   docker compose -p platform-infra -f docker-compose.infra.yml --env-file infra.env up -d

networks:
  platform:
    name: platform
    driver: bridge

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

services:
  caddy:
    # PINNED, do not float back to caddy:2-alpine. v2.11.4 silently drops every
    # request header whose name contains an underscore, with no opt-out and no
    # log line (caddyserver/caddy#7808). That kills `api_access_token` — the
    # spelling Chatwoot's own API docs specify — for every caller outside this
    # VM, and surfaces as a 401 that reads exactly like a bad credential. Cost
    # us most of 2026-08-21 on the AEON360 integration; see
    # docs/runbooks/aeon360-whatsapp-cutover.md §3.1.
    # v2.8.4/2.9.1/2.10.2 all pass the header through; 2.11.4 does not. The fix
    # is milestoned for v2.11.5 — re-test with the probe in that runbook and
    # move back to a floating tag once it ships.
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_IP: ${PUBLIC_IP}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/tenants:/etc/caddy/tenants:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - platform

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    command: postgres -c shared_buffers=512MB
    mem_limit: 1500m
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - platform
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    mem_limit: 128m
    networks:
      - platform
