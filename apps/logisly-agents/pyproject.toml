[project]
name = "logisly-agents"
version = "0.1.0"
description = "Logisly demo agents (ADK): UC2 quotation filtering, UC3 product manager"
requires-python = ">=3.12"
dependencies = [
  "google-adk==2.2.0",
  "google-genai>=2.8.0",
  "pydantic-settings>=2.6",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8", "pillow>=10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["logisly_agents"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = '-m "not live"'
markers = ["live: calls Vertex AI (deselected by default)"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
  "ignore:BaseAgentConfig is deprecated:DeprecationWarning",
  "ignore:.*JSON_SCHEMA_FOR_FUNC_DECL.*:UserWarning",
]
