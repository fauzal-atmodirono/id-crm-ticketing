# How Logisly's product team uses GitHub (mock). The agent writes issues that
# follow these rules; the demo repo mirrors them.
org: logisly
repos:
  driver-app:     {stack: "Android, Kotlin", owner: "Rizky Ramadhan", area: "area:driver-app"}
  platform-api:   {stack: "Go, PostgreSQL", owner: "Agung Setiawan", area: "area:platform"}
  shipper-portal: {stack: "React, TypeScript", owner: "Laras Ayu", area: "area:shipper-portal"}
  ops-console:    {stack: "React, TypeScript", owner: "Laras Ayu", area: "area:ops-console"}
  data-pipelines: {stack: "dbt, Python", owner: "Wulan Sari", area: "area:data"}

labels:
  type:     [type:feature, type:bug, type:chore, type:spike]
  area:     [area:driver-app, area:platform, area:shipper-portal, area:ops-console, area:data, area:ai-agent]
  priority:
    priority:P0: "production down / blocking revenue, fix now"
    priority:P1: "this sprint"
    priority:P2: "next 1-2 sprints"
    priority:P3: "backlog"
  estimate: [sp:1, sp:2, sp:3, sp:5, sp:8]
  status:   [status:blocked, status:needs-design, status:duplicate]

issue_title: "[<area>] <verb-first short sentence>"   # e.g. "[driver-app] Kirim voice note ke AI assistant"
branch: "<type>/<issue-number>-<slug>"                 # e.g. feature/162-chat-screen
epic: "an issue labelled type:feature with a task list linking its stories"

definition_of_ready:
  - user story and acceptance criteria written
  - estimate label set
  - dependencies linked ("Blocked by #n")
  - design attached when the story has UI

definition_of_done:
  - merged to main with review from the repo owner
  - QA passed on staging
  - release note line added

milestones: see team/calendar.yaml (one milestone per sprint, named "Sprint 26.22")
