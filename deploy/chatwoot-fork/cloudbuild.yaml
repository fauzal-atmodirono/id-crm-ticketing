# Cloud Build pipeline for the Proton-patched Chatwoot image.
# Trigger manually or on push to the chatwoot-fork/ subtree.
#
# Required substitutions (set in the Cloud Build trigger or --substitutions flag):
#   _REGISTRY    e.g. asia-southeast1-docker.pkg.dev/lv-playground-genai/proton-images
#   _TAG_SUFFIX  OPTIONAL, and the safety valve. Appended to the image tag, so
#                _TAG_SUFFIX=-p6p14 builds <_IMAGE_NAME>:v4.15.1-custom-p6p14
#                instead of overwriting v4.15.1-custom.
#
#                THIS MATTERS: every tenant that pins v4.15.1-custom shares it.
#                On 2026-08-11 both `default.env` and `proton.env` pinned exactly
#                that tag, so rebuilding it would have handed the Proton demo
#                tenant a new image on its next recreate -- without anyone
#                running a command against Proton. Build to a suffixed tag and
#                point only the tenant you intend to change at it.
#
#                Default empty, so an unsuffixed build behaves exactly as before.
#   _BUILD_SHA   the id-crm-ticketing repo's short git SHA at build time (e.g.
#                $(git rev-parse --short HEAD), run from the repo root before
#                invoking this build) -- baked into the image as the in-app
#                "Build <sha>" identifier so it's not stuck showing upstream's
#                frozen v4.15.1 release commit. Omit to leave it "unknown".
#
# Run manually (from the id-crm-ticketing repo root):
#   gcloud builds submit deploy/chatwoot-fork/ \
#     --config deploy/chatwoot-fork/cloudbuild.yaml \
#     --substitutions _REGISTRY=asia-southeast1-docker.pkg.dev/lv-playground-genai/proton-images,_BUILD_SHA=$(git rev-parse --short HEAD)

substitutions:
  _REGISTRY: asia-southeast1-docker.pkg.dev/lv-playground-genai/proton-images
  _BUILD_SHA: unknown
  _TAG_SUFFIX: ""
  # Image (repository) name inside _REGISTRY. Defaults to the historical
  # `proton-chatwoot` so existing tenants and their pinned CHATWOOT_IMAGE keep
  # resolving unchanged. OVERRIDE IT for any registry belonging to a different
  # customer -- shipping an image carrying another customer's name into their
  # Artifact Registry is a disclosure, not just untidy naming.
  _IMAGE_NAME: proton-chatwoot

steps:
  - id: read-version
    name: bash
    env:
      - _TAG_SUFFIX=${_TAG_SUFFIX}
      - _IMAGE_NAME=${_IMAGE_NAME}
    script: |
      VERSION=$(cat UPSTREAM_VERSION)
      echo "UPSTREAM_VERSION=${VERSION}" >> /workspace/build.env
      echo "Building ${_IMAGE_NAME}:${VERSION}-custom${_TAG_SUFFIX}"

  - id: build
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        source /workspace/build.env
        docker build \
          --build-arg UPSTREAM_VERSION=$${UPSTREAM_VERSION} \
          --build-arg PROTON_BUILD_SHA=$${_BUILD_SHA} \
          -t $${_REGISTRY}/$${_IMAGE_NAME}:$${UPSTREAM_VERSION}-custom$${_TAG_SUFFIX} \
          .
    env:
      - _REGISTRY=${_REGISTRY}
      - _BUILD_SHA=${_BUILD_SHA}
      - _TAG_SUFFIX=${_TAG_SUFFIX}
      - _IMAGE_NAME=${_IMAGE_NAME}

  - id: push
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        source /workspace/build.env
        docker push $${_REGISTRY}/$${_IMAGE_NAME}:$${UPSTREAM_VERSION}-custom$${_TAG_SUFFIX}
    env:
      - _REGISTRY=${_REGISTRY}
      - _TAG_SUFFIX=${_TAG_SUFFIX}
      - _IMAGE_NAME=${_IMAGE_NAME}

options:
  machineType: E2_HIGHCPU_8
  diskSizeGb: 50
  logging: CLOUD_LOGGING_ONLY
