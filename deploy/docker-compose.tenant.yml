# One tenant's full application stack: Chatwoot + agent, plus a
# dedicated Redis and memcached. Attaches to the shared external `platform`
# network created by docker-compose.infra.yml and reaches the shared Postgres
# by name. Every container name/alias is prefixed with ${TENANT} so multiple
# tenant projects coexist on the one shared network without DNS collisions.
#
# Usage (normally via scripts/add-tenant.sh):
#   docker compose -p <tenant> -f docker-compose.tenant.yml --env-file tenants/<tenant>.env up -d

x-chatwoot-env: &chatwoot-env
  RAILS_ENV: production
  NODE_ENV: production
  INSTALLATION_ENV: docker
  RAILS_LOG_TO_STDOUT: "true"
  SECRET_KEY_BASE: ${SECRET_KEY_BASE}
  # Override for local dev to dodge browsers' HTTPS-upgrade of "public-looking"
  # nip.io hostnames (Caddy only serves this site over plain http://, so a
  # forced-https retry gets connection-reset). *.localhost is exempt from that
  # upgrade per RFC 6761, so tenants/default.env sets this to http://crm.localhost.
  # Must stay equal to PROTON_BACKEND_PUBLIC_URL below — that's what keeps the
  # SPA's backend fetches same-origin.
  FRONTEND_URL: ${FRONTEND_URL_OVERRIDE:-http://${HOST_PREFIX}crm.${PUBLIC_IP}.nip.io}
  POSTGRES_HOST: postgres
  POSTGRES_USERNAME: chatwoot_${TENANT}
  POSTGRES_PASSWORD: ${CHATWOOT_DB_PASSWORD}
  POSTGRES_DATABASE: chatwoot_${TENANT}
  REDIS_URL: redis://:${REDIS_PASSWORD}@${TENANT}-redis:6379
  REDIS_PASSWORD: ${REDIS_PASSWORD}
  ACTIVE_STORAGE_SERVICE: local
  # Outbound SMTP: defaults to the shared Mailpit catcher; override per tenant in
  # tenants/<tenant>.env (e.g. Gmail SMTP) to deliver real mail.
  SMTP_ADDRESS: ${SMTP_ADDRESS:-mailpit}
  SMTP_PORT: ${SMTP_PORT:-1025}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_AUTHENTICATION: ${SMTP_AUTHENTICATION:-}
  SMTP_DOMAIN: ${SMTP_DOMAIN:-}
  SMTP_ENABLE_STARTTLS_AUTO: ${SMTP_ENABLE_STARTTLS_AUTO:-false}
  MAILER_SENDER_EMAIL: ${MAILER_SENDER_EMAIL:-Chatwoot <noreply@localhost>}
  ENABLE_ACCOUNT_SIGNUP: "false"
  WEB_CONCURRENCY: 1
  RAILS_MAX_THREADS: 5
  # Browser-facing backend URL injected into the SPA (window.__PROTON_CONFIG__).
  # Must be an origin the BROWSER can reach — NOT the internal ${TENANT}-backend
  # host (that only resolves inside the Docker network, used by the agent service).
  # Caddy proxies /metrics,/kb,/assist on this origin to the backend, so keeping it
  # equal to the SPA origin means same-origin calls with no CORS.
  PROTON_BACKEND_URL: ${PROTON_BACKEND_PUBLIC_URL:-http://crm.localhost}
  PROTON_BACKEND_KEY: ${PROTON_BACKEND_KEY:-}
  PROTON_FEATURES: ${PROTON_FEATURES:-ai_assist,nav_menu,copilot,knowledge}
  # ONE SWITCH PER FEATURE. These are the SAME variables the `backend` service
  # reads out of tenants/<tenant>.env (it takes that file wholesale via
  # `env_file:`), forwarded here so the Rails layout can turn each one into the
  # PROTON_FEATURES entry the SPA's own gate reads — see fork patch
  # 0058-feature-flag-unification.patch.
  #
  # Without this, each of these features has TWO switches: the documented backend
  # flag, and `PROTON_FEATURES` — and an operator who flips only the documented
  # one gets nothing, with no way to tell a mis-set tenant from a broken feature.
  # That happened twice (blocked-work register 3g and 3h), which is why the fix is
  # this passthrough rather than another paragraph of documentation.
  #
  # Additive and still default-off: `false` (the default here) contributes no
  # feature name, so a tenant that sets neither renders the identical feature list
  # it does today, and a tenant that already listed a name in PROTON_FEATURES by
  # hand keeps it either way. Add a line here for every future flag whose feature
  # also has a `hasFeature(...)` gate in the fork.
  INBOUND_ALERTS_ENABLED: ${INBOUND_ALERTS_ENABLED:-false}
  FAQ_SUGGESTION_POPUP_ENABLED: ${FAQ_SUGGESTION_POPUP_ENABLED:-false}

networks:
  platform:
    external: true
    name: platform

volumes:
  chatwoot_storage:
  redis_data:

services:
  redis:
    image: redis:7-alpine
    container_name: ${TENANT}-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    mem_limit: 256m
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
    volumes:
      - redis_data:/data
    networks:
      platform:
        aliases:
          - ${TENANT}-redis
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  memcached:
    image: memcached:1.6-alpine
    container_name: ${TENANT}-memcached
    restart: unless-stopped
    command: memcached -m 64
    mem_limit: 64m
    networks:
      platform:
        aliases:
          - ${TENANT}-memcached

  chatwoot-rails:
    image: ${CHATWOOT_IMAGE:-chatwoot/chatwoot:v4.15.1}
    container_name: ${TENANT}-chatwoot-rails
    restart: unless-stopped
    mem_limit: 1500m
    entrypoint: docker/entrypoints/rails.sh
    command: ["bundle", "exec", "rails", "s", "-p", "3000", "-b", "0.0.0.0"]
    environment:
      <<: *chatwoot-env
    volumes:
      - chatwoot_storage:/app/storage
    networks:
      platform:
        aliases:
          - ${TENANT}-chatwoot-rails
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  chatwoot-sidekiq:
    image: ${CHATWOOT_IMAGE:-chatwoot/chatwoot:v4.15.1}
    container_name: ${TENANT}-chatwoot-sidekiq
    restart: unless-stopped
    mem_limit: 1024m
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]
    environment:
      <<: *chatwoot-env
    volumes:
      - chatwoot_storage:/app/storage
    networks:
      platform:
        aliases:
          - ${TENANT}-chatwoot-sidekiq
    depends_on:
      redis:
        condition: service_healthy

  agent:
    build: ../agent
    image: platform-agent:latest
    container_name: ${TENANT}-agent
    restart: unless-stopped
    mem_limit: 384m
    # Tenant env is the source of truth (LIFECYCLE_*, EMAIL_AUTOACK_*, etc.);
    # the explicit `environment:` below overrides internal URLs/wiring.
    env_file:
      - tenants/${TENANT}.env
    environment:
      CHATWOOT_URL: http://${TENANT}-chatwoot-rails:3000
      CHATWOOT_PUBLIC_URL: http://${HOST_PREFIX}crm.${PUBLIC_IP}.nip.io
      AGENT_PUBLIC_URL: http://${HOST_PREFIX}agent.${PUBLIC_IP}.nip.io
      CHATWOOT_API_TOKEN: ${CHATWOOT_API_TOKEN}
      CHATWOOT_PLATFORM_TOKEN: ${CHATWOOT_PLATFORM_TOKEN}
      CHATWOOT_ACCOUNT_ID: ${CHATWOOT_ACCOUNT_ID}
      CHATWOOT_WEBHOOK_SECRET: ${CHATWOOT_WEBHOOK_SECRET}
      CHATWOOT_BOT_TOKEN: ${CHATWOOT_BOT_TOKEN}
      CHATWOOT_BOT_SECRET: ${CHATWOOT_BOT_SECRET}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL}
      AGENT_MODE: ${AGENT_MODE}
      AUTO_RESOLVE: ${AUTO_RESOLVE}
      AGENT_DATABASE_URL: postgresql+psycopg://agent_${TENANT}:${AGENT_DB_PASSWORD}@postgres:5432/agent_${TENANT}
      PROTON_BACKEND_URL: ${PROTON_BACKEND_URL:-http://${TENANT}-backend:8080}
      PROTON_BACKEND_KEY: ${PROTON_BACKEND_KEY:-}
      # Gemini auth via Vertex AI + Application Default Credentials (same SA key
      # as the backend). When GCP_ADC_PATH is unset, GOOGLE_APPLICATION_
      # CREDENTIALS is empty and ADC falls back to the metadata server / off.
      GOOGLE_APPLICATION_CREDENTIALS: ${GCP_ADC_PATH:+/gcp/adc.json}
    volumes:
      # Serve the static in-Chatwoot dashboard apps (Knowledge Manager,
      # Taxonomy Manager) via the agent at /apps/<name>/.
      - ../apps:/srv/apps:ro
      # Mount the host ADC file read-only when GCP_ADC_PATH is set (else /dev/null).
      - ${GCP_ADC_PATH:-/dev/null}:/gcp/adc.json:ro
    networks:
      platform:
        aliases:
          - ${TENANT}-agent
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  backend:
    build: ../backend/apps/backend
    image: platform-backend:latest
    container_name: ${TENANT}-backend
    restart: unless-stopped
    mem_limit: 768m
    env_file:
      - tenants/${TENANT}.env
    environment:
      PORT: "8080"
      HOST: 0.0.0.0
      CHATWOOT_API_URL: http://${TENANT}-chatwoot-rails:3000
      # GCP auth via Application Default Credentials (ADC) — the same mechanism
      # the proton backend uses. Set GCP_ADC_PATH in the tenant env to the host
      # path of application_default_credentials.json to enable Vertex/Firestore;
      # when unset, GOOGLE_APPLICATION_CREDENTIALS is empty and ADC is off (the
      # backend stays on mock/off providers — behavior-preserving).
      GOOGLE_APPLICATION_CREDENTIALS: ${GCP_ADC_PATH:+/gcp/adc.json}
    volumes:
      # Mounts the host ADC file read-only when GCP_ADC_PATH is set; otherwise
      # mounts /dev/null (harmless, and GOOGLE_APPLICATION_CREDENTIALS stays empty).
      - ${GCP_ADC_PATH:-/dev/null}:/gcp/adc.json:ro
    networks:
      platform:
        aliases:
          - ${TENANT}-backend
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
